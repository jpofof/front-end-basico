<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <label for="num">Número: </label>
    <input type="text" name="num" id="num">
    <input type="button" value="Verificar" onclick="verificar()">
    <br><br>
    <label for="Frequencia">Frequencia: </label>
    <input type="text" name="freq" id="freq">

    <label for="Media">Média: </label>
    <input type="text" name="med" id="med">
    <input type="button" value="Ver se Passou" onclick="media()">


    <script>
        function verificar() {
            let numero = Number(document.getElementById("num").value);
            /*numero = Number (numero)*/
            if (numero == 0)
                alert("Nulo");
            else if (numero > 0)
                alert("Positivo");
            else
                alert("Negativo");

        }
        function media() {
            let numerofreq = Number(document.getElementById("freq").value);
            let media = Number(document.getElementById("med").value);

            if (numerofreq >= 75 && media >= 6)
                alert("A");
            else if (media >= 6)
                alert("RF");
            else if (numerofreq >= 75)
                alert("RN");
            else
                alert("RNF");

        }

    </script>
</body>

</html>
