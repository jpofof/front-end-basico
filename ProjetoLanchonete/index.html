<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Lanchonete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="alert alert-primary" role="alert">
            Lanchonete do Gordo
        </div>

        <form>
            <div class="row">
                <div class="col-3">
                    <label for="mesa" class="form-label">Mesa</label>
                    <input type="number" name="mesa" id="mesa" class="form-control">
                </div>

                <div class="col-9">
                    <label for="nome" class="form-label">Nome do Cliente</label>
                    <input type="text" name="nome" id="nome" class="form-control">
                </div>
            </div>
        </form>

        <div class="row mt-3">
            <div class="col-6">
                <label for="lanches" class="form-label">
                    Escolha o Lanche...
                </label>
                <select name="lanches" id="lanches" class="form-select">
                    <option value="20">Natural</option>
                    <option value="35">Vegano</option>
                    <option value="30">X-Tudo</option>
                    <option value="17.50">Promoção do Dia</option>
                </select>
            </div>

            <div class="col-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="5" id="checkBacon" name="adicionais">
                    <label class="form-check-label" for="checkBacon">
                        Bacon
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="10" id="checkPicles" name="adicionais">
                    <label class="form-check-label" for="checkPicles">
                        Picles
                    </label>
                </div>
            </div>

            <div class="col-3"></div>
        </div>

        <div>
            <input onclick="calcular()" type="button" value="Calcular" class="btn btn-secondary" id="calcular">
            <button type="button" class="btn btn-primary" id="calcularDesc">
                Calcular com Desconto
            </button>
        </div>

        <p id="valorPagar">Total à Pagar:</p>
        <p id="valorPagarDesc">Total à Pagar com Desconto:</p>
    </div>

    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    </div>
</body>

</html>
